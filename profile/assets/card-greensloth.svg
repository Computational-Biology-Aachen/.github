<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="320" height="170">
  <defs>
    <linearGradient id="bg-greensloth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00767c"/>
      <stop offset="100%" stop-color="#003236"/>
    </linearGradient>
    <filter id="shadow-greensloth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="312" height="162" rx="20" fill="url(#bg-greensloth)" filter="url(#shadow-greensloth)"/>
  <rect x="4.5" y="4.5" width="311" height="161" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- abstract motif: clustered organic blobs (curated collection) -->
  <ellipse cx="258" cy="126" rx="34" ry="26" fill="#f6a800" fill-opacity="0.85" transform="rotate(-18 258 126)"/>
  <ellipse cx="292" cy="90" rx="20" ry="16" fill="#f6a800" fill-opacity="0.6" transform="rotate(12 292 90)"/>
  <ellipse cx="288" cy="150" rx="14" ry="11" fill="#f6a800" fill-opacity="0.7" transform="rotate(-6 288 150)"/>

  <text x="24" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#ffffff">GreenSloth</text>
  <text x="24" y="88" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="15" fill="#d7e6e6">
    <tspan x="24" dy="0">Curated database of</tspan>
    <tspan x="24" dy="20">photosynthesis ODE models</tspan>
  </text>
</svg>
