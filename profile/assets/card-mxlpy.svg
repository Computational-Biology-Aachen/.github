<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="320" height="170">
  <defs>
    <linearGradient id="bg-mxlpy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00767c"/>
      <stop offset="100%" stop-color="#003236"/>
    </linearGradient>
    <filter id="shadow-mxlpy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="312" height="162" rx="20" fill="url(#bg-mxlpy)" filter="url(#shadow-mxlpy)"/>
  <rect x="4.5" y="4.5" width="311" height="161" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- abstract network motif: mechanistic model nodes -->
  <g stroke="#f6a800" stroke-width="2" stroke-opacity="0.9" fill="none">
    <line x1="228" y1="130" x2="264" y2="104"/>
    <line x1="264" y1="104" x2="292" y2="126"/>
    <line x1="264" y1="104" x2="252" y2="66"/>
    <line x1="292" y1="126" x2="296" y2="150"/>
  </g>
  <circle cx="228" cy="130" r="6" fill="#f6a800"/>
  <circle cx="264" cy="104" r="8" fill="#f6a800"/>
  <circle cx="292" cy="126" r="6" fill="#f6a800" fill-opacity="0.85"/>
  <circle cx="252" cy="66" r="5" fill="#f6a800" fill-opacity="0.7"/>
  <circle cx="296" cy="150" r="4" fill="#f6a800" fill-opacity="0.6"/>

  <text x="24" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#ffffff">MxlPy</text>
  <text x="24" y="88" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="15" fill="#d7e6e6">
    <tspan x="24" dy="0">Build mechanistic learning</tspan>
    <tspan x="24" dy="20">models easily</tspan>
  </text>
</svg>
